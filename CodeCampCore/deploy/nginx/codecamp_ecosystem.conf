# ==============================================================================
# Nginx Configuration for CodeCamp 3-System Ecosystem
# Place in: /etc/nginx/sites-available/codecamp_ecosystem.conf
# Enable:   sudo ln -s /etc/nginx/sites-available/codecamp_ecosystem.conf /etc/nginx/sites-enabled/
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Primary Public Website & Master Academy ERP (CodeCampCore)
# Domain: codecamp.com.ng, www.codecamp.com.ng, core.codecamp.com.ng, portal.codecamp.com.ng
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name codecamp.com.ng www.codecamp.com.ng core.codecamp.com.ng portal.codecamp.com.ng;

    client_max_body_size 50M;

    location /static/ {
        alias /var/www/codecamp2026/CodeCampCore/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/codecamp2026/CodeCampCore/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. Summer Camp 2026 Legacy / Archival Site (Codecamp)
# Domain: summer.codecamp.com.ng
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name summer.codecamp.com.ng;

    client_max_body_size 30M;

    location /static/ {
        alias /var/www/codecamp2026/Codecamp/camp/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/codecamp2026/Codecamp/camp/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 3. Kiosk Scanner & Attendance Hub (attendance-system)
# Domain: attendance.codecamp.com.ng
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name attendance.codecamp.com.ng;

    client_max_body_size 25M;

    location /static/ {
        alias /var/www/codecamp2026/attendance-system/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/codecamp2026/attendance-system/backend/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

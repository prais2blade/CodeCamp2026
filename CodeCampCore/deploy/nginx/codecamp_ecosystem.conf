# ==============================================================================
# Nginx Ecosystem Configuration for CodeCamp Innovation Hub & Portals
# Configured for Production HTTPS (Port 443) & HTTP (Port 80)
# ==============================================================================

# HTTP -> HTTPS Global Redirect
server {
    listen 80;
    listen [::]:80;
    server_name codecamp.com.ng www.codecamp.com.ng core.codecamp.com.ng portal.codecamp.com.ng attendance.codecamp.com.ng summer.codecamp.com.ng;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 1. Primary Public Website & Master Academy ERP (CodeCampCore)
# Domain: codecamp.com.ng, www.codecamp.com.ng, core.codecamp.com.ng, portal.codecamp.com.ng
# Proxy:  http://127.0.0.1:8000
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codecamp.com.ng www.codecamp.com.ng core.codecamp.com.ng portal.codecamp.com.ng;

    ssl_certificate /etc/letsencrypt/live/codecamp.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codecamp.com.ng/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location /static/ {
        alias /var/www/codecamp2026/CodeCampCore/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/codecamp2026/CodeCampCore/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. Attendance Hub & Kiosk Scanner (attendance-system)
# Domain: attendance.codecamp.com.ng
# Proxy:  http://127.0.0.1:8001
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name attendance.codecamp.com.ng;

    ssl_certificate /etc/letsencrypt/live/codecamp.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codecamp.com.ng/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    location /static/ {
        alias /var/www/codecamp2026/attendance-system/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/codecamp2026/attendance-system/backend/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 3. Summer Camp 2026 Legacy / Archival Site (Codecamp)
# Domain: summer.codecamp.com.ng
# Proxy:  http://127.0.0.1:8002
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name summer.codecamp.com.ng;

    client_max_body_size 30M;

    location /static/ {
        alias /var/www/codecamp2026/Codecamp/camp/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /var/www/codecamp2026/Codecamp/camp/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

<div class="card">
  {% if post.thumbnail %}
  <img src="{{ post.thumbnail.url }}" class="rounded mb-4">
  {% endif %}

  <h3 class="font-semibold text-xl">
    <a href="{{ post.get_absolute_url }}">{{ post.title }}</a>
  </h3>

  <p class="text-gray-600 mt-2">{{ post.excerpt }}</p>

  <a href="{{ post.get_absolute_url }}" class="btn-primary mt-4 inline-block">
    Read More
  </a>
</div>

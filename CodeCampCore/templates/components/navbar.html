{% load static %}

<nav class="fixed top-0 left-0 w-full z-50 bg-dark/80 backdrop-blur-md shadow-glow">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">

        <!-- LOGO -->
        <a href="/" class="flex items-center space-x-3">
            <img src="{% static 'images/logo.png' %}" class="h-10 drop-shadow-glow w-20" alt="CodeCamp">
            <span class="text-white font-bold text-2xl">CodeCamp</span>
        </a>

        <!-- Desktop Menu -->
        <div class="hidden md:flex items-center space-x-10">
            <a href="/" class="text-white hover:text-primaryLight transition duration-300">
                Home
            </a>

            <a href="{% url 'website:about' %}" class="text-white hover:text-primaryLight transition duration-300">
                About
            </a>

            <a href="{% url 'website:training_programs' %}" class="text-white hover:text-primaryLight transition duration-300">
                Training
            </a>

            <a href="{% url 'website:software_solutions' %}" class="text-white hover:text-primaryLight transition duration-300">
                Software
            </a>

            <a href="{% url 'website:contact' %}" class="text-white hover:text-primaryLight transition duration-300">
                Contact
            </a>

            <a href="{% url 'home' %}" class="btn-primary">
                Enroll Now
            </a>

            <a href="/competition/" class="btn-primary">
                CRACKdaCODE Competition
            </a>
        </div>

        <!-- Mobile Menu Button -->
        <button id="mobileMenuBtn" type="button" class="md:hidden text-white" aria-label="Toggle navigation" title="Toggle navigation">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>

    </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="hidden bg-dark border-t border-primary/30">
        <div class="px-6 py-4 space-y-4">

            <a href="/" class="block text-white hover:text-primaryLight transition duration-300">
                Home
            </a>

            <a href="{% url 'website:about' %}" class="block text-white hover:text-primaryLight transition duration-300">
                About
            </a>

            <a href="{% url 'website:training_programs' %}" class="block text-white hover:text-primaryLight transition duration-300">
                Training
            </a>

            <a href="{% url 'website:software_solutions' %}" class="block text-white hover:text-primaryLight transition duration-300">
                Software
            </a>

            <a href="{% url 'website:contact' %}" class="block text-white hover:text-primaryLight transition duration-300">
                Contact
            </a>

            <a href="{% url 'home' %}"
                class="block bg-primary text-white py-2 px-4 text-center rounded-lg hover:opacity-90 transition">
                Enroll Now
            </a>

            <a href="/competition/"
                class="block bg-primary text-white py-2 px-4 text-center rounded-lg hover:opacity-90 transition">
                CRACKdaCODE Competition
            </a>

        </div>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');

        mobileMenuBtn.addEventListener('click', function () {
            mobileMenu.classList.toggle('hidden');
        });
    });
</script>

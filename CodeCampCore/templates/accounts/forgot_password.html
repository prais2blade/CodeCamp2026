{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<style>
    body {
        background: linear-gradient(135deg, #1f3b73, #4b79a1, #21d4fd);
        background-size: 400% 400%;
        animation: gradientShift 12s ease infinite;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .auth-card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        border-radius: 15px;
        padding: 40px;
        width: 420px;
        color: #fff;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        animation: fadeInUp 1s ease;
    }
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="auth-card">

        <h3 class="text-center mb-4" style="font-weight: 600;">Reset Password</h3>

        <p class="text-center mb-4">Enter your email and we will send you a reset link.</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group mb-4">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control form-control-lg" placeholder="enter email…" required>
            </div>

            <button class="btn btn-light btn-block btn-lg text-dark font-weight-bold">
                Send Reset Link
            </button>
        </form>

        <p class="text-center mt-3">
            Remember your password?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>
</div>

{% endblock %}

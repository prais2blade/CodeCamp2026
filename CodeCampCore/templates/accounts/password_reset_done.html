{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Successful{% endblock %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #1f3b73, #4b79a1, #21d4fd);
        background-size: 400% 400%;
        animation: gradientShift 12s ease infinite;
    }
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="auth-card text-center">

        <h3>Password Reset Complete</h3>
        <p class="mt-2">Your password has been successfully updated.</p>

        <a href="{% url 'login' %}" class="btn btn-light btn-lg mt-3 text-dark font-weight-bold">
            Login Now
        </a>

    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Verify Email{% endblock %}

{% block content %}
<style>
    body { background: linear-gradient(135deg, #004e92, #000428); }
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height: 92vh;">
    <div class="auth-card text-center">
        <h3>Email Verification Sent ✅</h3>
        <p class="mt-2">We sent a verification link to your email.</p>

        <p class="mt-3 text-muted">Didn’t receive it?</p>
        <a href="{% url 'resend_verification' %}" class="btn btn-outline-light">
            Resend Email
        </a>

        <div class="mt-4">
            <a href="{% url 'login' %}" class="text-light">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}

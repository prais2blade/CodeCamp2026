{% extends "layouts/student_base.html" %}

{% block content %}

<div class="container-fluid">

    <h3 class="mb-3">Submit Assignment</h3>

    <div class="card">
        <div class="card-body">

            <h5>{{ assignment.title }}</h5>
            <p>{{ assignment.description }}</p>
            <p><strong>Due:</strong> {{ assignment.due_date }}</p>

            {% if existing %}
                <div class="alert alert-info">
                    You have already submitted this assignment. You can update it.
                </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label>Upload File</label>
                    <input type="file" name="file" class="form-control" required>
                </div>

                <button class="btn btn-success">
                    {% if existing %}Update Submission{% else %}Submit Assignment{% endif %}
                </button>

            </form>

        </div>
    </div>

</div>

{% endblock %}

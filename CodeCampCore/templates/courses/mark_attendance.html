{% extends "layouts/instructor_base.html" %}

{% block content %}

<div class="container-fluid">

    <h3 class="mb-3">{{ subject.name }} - Attendance</h3>

    <form method="POST">
        {% csrf_token %}

        <div class="card">
            <div class="card-body table-responsive">

                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for student in students %}
                        <tr>
                            <td>{{ student.user.username }}</td>
                            <td>
                                <select name="status_{{ student.user.id }}" class="form-control">
                                    <option value="Present">Present</option>
                                    <option value="Absent">Absent</option>
                                </select>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>

            </div>
        </div>

        <button class="btn btn-success">Save Attendance</button>

    </form>

</div>

{% endblock %}

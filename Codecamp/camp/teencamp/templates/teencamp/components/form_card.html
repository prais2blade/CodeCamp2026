<div class="pds-card mb-8">

    {% if title %}
        <div class="mb-6">

            <h2 class="text-2xl font-bold text-slate-800">

                {{ title }}

            </h2>

            {% if subtitle %}
                <p class="mt-2 text-slate-500">

                    {{ subtitle }}

                </p>
            {% endif %}

        </div>
    {% endif %}

    {{ content }}

</div>

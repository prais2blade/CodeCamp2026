{% if messages %}
<div class="fixed top-24 right-6 z-50 space-y-3">

    {% for message in messages %}

    <div class="
            rounded-xl
            px-5
            py-4
            shadow-lg
            text-white

            {% if message.tags == 'success' %}
                bg-green-600
            {% elif message.tags == 'error' %}
                bg-red-600
            {% elif message.tags == 'warning' %}
                bg-yellow-500 text-black
            {% else %}
                bg-blue-600
            {% endif %}
        ">

        {{ message }}

    </div>

    {% endfor %}

</div>
{% endif %}

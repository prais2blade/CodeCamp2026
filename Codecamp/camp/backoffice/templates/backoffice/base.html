{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CodeCamp Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-purple-800 text-white py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">CodeCamp Admin</h1>
        <div class="flex gap-4">
            <a href="{% url 'backoffice:dashboard' %}" class="hover:underline">Dashboard</a>
            <a href="{% url 'backoffice:registrations' %}" class="hover:underline">Registrations</a>
            <a href="{% url 'backoffice:export-csv' %}" class="hover:underline">Download CSV</a>
            
            <a href="{% url 'logout' %}" class="hover:underline">Logout</a>
        </div>
    </header>

    <!-- Page Content -->
    <main class="p-6 max-w-7xl mx-auto">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>

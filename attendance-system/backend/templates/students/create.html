{% extends "base.html" %}

{% block title %}
Create Student
{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto p-6">

    <div class="bg-white rounded-xl shadow p-6">

        <h1 class="text-2xl font-bold mb-6">

            Create Student

        </h1>

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="bg-blue-600 text-white px-5 py-3 rounded-lg"
            >

                Save Student

            </button>

        </form>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}
Delete Student
{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto p-6">

    <div class="bg-white rounded-xl shadow p-8">

        <h1 class="text-3xl font-bold text-red-600 mb-4">

            Delete Student

        </h1>

        <p class="mb-6">

            Are you sure you want to delete:

            <strong>

                {{ student.first_name }}
                {{ student.last_name }}

            </strong>

            ?

        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="flex gap-4">

                <a
                    href="{% url 'students:student_detail' student.id %}"
                    class="bg-gray-500 text-white px-4 py-2 rounded"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="bg-red-600 text-white px-4 py-2 rounded"
                >
                    Delete Student
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}

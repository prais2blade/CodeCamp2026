{% extends "admin_portal/base.html" %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}

<section class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
    <div class="mb-6">
        <p class="text-sm font-semibold uppercase text-emerald-700">Classes</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-950">{{ title }}</h1>
    </div>

    <form method="POST" class="rounded-lg bg-white border border-slate-200 shadow-sm p-6 space-y-5">
        {% csrf_token %}

        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-slate-700 mb-1">
                {{ field.label }}
            </label>
            {{ field }}
            {% for error in field.errors %}
            <p class="mt-1 text-sm text-red-700">{{ error }}</p>
            {% endfor %}
        </div>
        {% endfor %}

        <div class="flex flex-wrap gap-2">
            <button type="submit" class="rounded-lg bg-emerald-800 px-5 py-3 font-semibold text-white hover:bg-emerald-900">
                {{ button_label }}
            </button>
            <a href="{% url 'school_admin:class_list' %}" class="rounded-lg border border-slate-300 bg-white px-5 py-3 font-semibold text-slate-900 hover:bg-slate-50">
                Cancel
            </a>
        </div>
    </form>
</section>

{% endblock %}

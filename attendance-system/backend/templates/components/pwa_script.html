{% load static %}
<script>
    (function () {
        if (!("serviceWorker" in navigator)) {
            return;
        }

        window.addEventListener("load", function () {
            navigator.serviceWorker
                .register("{% static 'service-worker.js' %}")
                .catch(function (error) {
                    console.log("Service Worker Registration Failed:", error);
                });
        });
    })();
</script>

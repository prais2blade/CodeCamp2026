{% extends "foundation/base.html" %}

{% block title %}
Foundation Login
{% endblock %}

{% block content %}

<section class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md rounded-lg bg-white border border-slate-200 shadow-sm p-6">
        <p class="text-sm font-semibold uppercase text-emerald-700">Sponsor Monitoring</p>
        <h1 class="mt-2 text-2xl font-bold text-slate-950">Foundation sign in</h1>

        <form method="POST" class="mt-6 space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">

            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-slate-700 mb-1">
                    {{ field.label }}
                </label>
                {{ field }}
                {% for error in field.errors %}
                <p class="mt-1 text-sm text-red-700">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}

            <button type="submit" class="w-full rounded-lg bg-emerald-800 px-5 py-3 font-semibold text-white hover:bg-emerald-900">
                Login
            </button>
        </form>
    </div>
</section>

{% endblock %}
